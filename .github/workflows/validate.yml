name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DIVELOG: git+https://github.com/dennisbakhuis/divelog#subdirectory=packages/server

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Pick the base revision
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "BASE=origin/${{ github.base_ref || 'main' }}" >> "$GITHUB_ENV"
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            echo "BASE=HEAD~1" >> "$GITHUB_ENV"
          else
            echo "BASE=" >> "$GITHUB_ENV"
          fi
      - name: Validate the commons
        run: uvx --from "$DIVELOG" divelog validate --kind sites ${BASE:+--base "$BASE"} .

  renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Pick the base revision
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "BASE=origin/${{ github.base_ref || 'main' }}" >> "$GITHUB_ENV"
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            echo "BASE=HEAD~1" >> "$GITHUB_ENV"
          else
            echo "BASE=" >> "$GITHUB_ENV"
          fi
      - name: Render the changed maps
        run: |
          mkdir -p renders
          [ -n "$BASE" ] || { echo "no base revision, nothing to compare"; exit 0; }
          for id in $(uvx --from "$DIVELOG" divelog maps changed --base "$BASE"); do
            uvx --from "$DIVELOG" divelog maps render "$id" --out "renders/$id.png"
          done
          ls renders
      - uses: actions/upload-artifact@v4
        with:
          name: map-renders
          path: renders/
          if-no-files-found: ignore
